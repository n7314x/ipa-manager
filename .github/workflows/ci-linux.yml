name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust and C++ foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/ipa-manager-rust-target" >> "$GITHUB_ENV"
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.1
          rustc --version
          cargo --version
      - name: Check Rust formatting
        working-directory: native/rust
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        working-directory: native/rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check Rust workspace
        working-directory: native/rust
        run: cargo check --workspace --all-targets
      - name: Test Rust workspace
        working-directory: native/rust
        run: cargo test --workspace
      - name: Configure C++ bridge
        run: |
          set -euo pipefail
          cmake -S native/signing-cpp -B "$RUNNER_TEMP/signing-cpp" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DIPA_SIGNING_BUILD_TESTS=ON
      - name: Build and test C++ bridge
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/signing-cpp" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/signing-cpp" --output-on-failure
