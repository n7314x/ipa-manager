name: Build Unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "scripts/build_unsigned_ipa.sh"
      - "scripts/install-xcodegen.sh"
      - "scripts/generate-xcode-project.sh"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "ios/**"
      - "scripts/build_unsigned_ipa.sh"
      - "scripts/install-xcodegen.sh"
      - "scripts/generate-xcode-project.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build canonical unsigned IPAManager.ipa
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Record build environment
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: scripts/install-xcodegen.sh
      - name: Generate and inspect project
        run: |
          set -euo pipefail
          scripts/generate-xcode-project.sh
          xcodebuild -project ios/IPAManager.xcodeproj -list
      - name: Test local Swift packages
        run: |
          set -euo pipefail
          for package in IPADomain SecurityKit IPALibrary IPAInspection SigningKit DeviceKit PersistenceKit; do
            swift test --package-path "ios/Packages/$package" --scratch-path "$RUNNER_TEMP/swift-$package"
          done
      - name: Build canonical unsigned IPA
        id: package
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ipa-manager-output
        run: scripts/build_unsigned_ipa.sh "$OUTPUT_DIR"
      - name: Add build summary
        env:
          IPA_SIZE: ${{ steps.package.outputs.ipa_size }}
          IPA_SHA256: ${{ steps.package.outputs.ipa_sha256 }}
          VERSION: ${{ steps.package.outputs.version }}
          BUILD_VERSION: ${{ steps.package.outputs.build_version }}
        run: |
          {
            echo "### IPA Manager unsigned device build"
            echo
            echo "- Runner: \`xcode-27\` (\`$(uname -m)\`)"
            echo "- Version/build: \`$VERSION ($BUILD_VERSION)\`"
            echo "- Signing: explicitly disabled; no signing secrets used"
            echo "- IPA: \`IPAManager.ipa\` ($IPA_SIZE bytes)"
            echo "- SHA-256: \`$IPA_SHA256\`"
            echo "- Payload app: \`Payload/IPAManager.app\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload IPA and metadata
        uses: actions/upload-artifact@v7
        with:
          name: IPAManager-unsigned-IPA
          path: |
            ${{ steps.package.outputs.ipa_path }}
            ${{ steps.package.outputs.metadata_path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: IPAManager-build-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/ipa-manager-output/IPAManager-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 30
