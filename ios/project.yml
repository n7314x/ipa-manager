name: IPAManager

options:
  bundleIdPrefix: xyz.n9007314
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  IPADomain:
    path: Packages/IPADomain
  IPALibrary:
    path: Packages/IPALibrary
  IPAInspection:
    path: Packages/IPAInspection
  SigningKit:
    path: Packages/SigningKit
  DeviceKit:
    path: Packages/DeviceKit
  SecurityKit:
    path: Packages/SecurityKit
  PersistenceKit:
    path: Packages/PersistenceKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  IPAManager:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: IPAManager/App
      - path: IPAManager/Features
      - path: IPAManager/Resources
        buildPhase: resources
        excludes:
          - Info.plist
    dependencies:
      - package: IPADomain
        product: IPADomain
      - package: IPALibrary
        product: IPALibrary
      - package: IPAInspection
        product: IPAInspection
      - package: SigningKit
        product: SigningKit
      - package: DeviceKit
        product: DeviceKit
      - package: SecurityKit
        product: SecurityKit
      - package: PersistenceKit
        product: PersistenceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.n9007314.ipamanager
        PRODUCT_NAME: IPAManager
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: IPAManager/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO

schemes:
  IPAManager:
    build:
      targets:
        IPAManager: all
    run:
      config: Debug
    archive:
      config: Release
